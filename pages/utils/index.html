    <style>
        .utils-main {
            max-width: 920px;
            margin: 0 auto;
            padding: 3rem 1.5rem;
        }

        .utils-home {
            color: #5DCAA5;
            text-decoration: none;
        }

        .utils-home:hover {
            text-decoration: underline;
        }

        .utils-main h1, .util-card h2 {
            font-family: "Lexend", sans-serif;
        }

        .utils-main h1 {
            margin: 2rem 0 0.5rem;
        }

        .utils-intro, .util-card p {
            color: #aaaaaa;
            line-height: 1.65;
        }

        .utils-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(min(100%, 300px), 1fr));
            gap: 1.25rem;
            margin-top: 2rem;
        }

        .util-card {
            background: #202020;
            border: 1px solid #303030;
            border-radius: 10px;
            padding: 1.5rem;
        }

        .util-card h2 {
            margin-bottom: 0.5rem;
            font-size: 1.2rem;
        }

        .util-card button {
            margin-top: 1.25rem;
            padding: 0.75rem 1.25rem;
            border: 0;
            border-radius: 6px;
            background: #5DCAA5;
            color: #181818;
            font: inherit;
            font-weight: 600;
            cursor: pointer;
        }

        .util-card button:disabled {
            cursor: not-allowed;
            opacity: 0.6;
        }

        .util-card button:focus-visible, .utils-home:focus-visible {
            outline: 2px solid #ffffff;
            outline-offset: 3px;
        }

        .util-card .util-status {
            margin-top: 0.75rem;
            font-size: 0.9rem;
        }
    </style>
</head>

<body>
    <main class="utils-main">
        <a class="utils-home" href="../../index.html">&larr; Portfolio</a>
        <h1>Utilities</h1>
        <p class="utils-intro">Small tools for everyday tasks, right in your browser.</p>

        <section class="utils-grid" aria-label="Utilities">
            <article class="util-card" id="wiggle">
                <h2>Wiggle</h2>
                <p>Keep your screen awake while this page is visible.</p>
                <button id="toggleBtn" type="button">Enable Wake Lock</button>
                <p id="status" class="util-status" role="status">Status: Screen can sleep normally.</p>
            </article>
        </section>
    </main>

    <script>
        let wakeLock = null;
        const toggleBtn = document.getElementById('toggleBtn');
        const statusText = document.getElementById('status');

        async function requestWakeLock() {
            try {
                wakeLock = await navigator.wakeLock.request('screen');
                statusText.textContent = 'Status: Screen is locked awake.';
                toggleBtn.textContent = 'Disable Wake Lock';
                wakeLock.addEventListener('release', () => {
                    statusText.textContent = 'Status: Wake lock was released.';
                    toggleBtn.textContent = 'Enable Wake Lock';
                });
            } catch (err) {
                statusText.textContent = `Error: ${err.name} - ${err.message}`;
            }
        }

        if (!('wakeLock' in navigator)) {
            toggleBtn.disabled = true;
            statusText.textContent = 'Status: Screen wake lock is not supported in this browser or context.';
        } else {
            toggleBtn.addEventListener('click', async () => {
                toggleBtn.disabled = true;
                try {
                    if (wakeLock !== null && !wakeLock.released) {
                        await wakeLock.release();
                        wakeLock = null;
                    } else {
                        await requestWakeLock();
                    }
                } catch (err) {
                    statusText.textContent = `Error: ${err.name} - ${err.message}`;
                } finally {
                    toggleBtn.disabled = false;
                }
            });

            document.addEventListener('visibilitychange', async () => {
                if (wakeLock !== null && wakeLock.released && document.visibilityState === 'visible') {
                    await requestWakeLock();
                }
            });
        }
    </script>
</body>

</html>
