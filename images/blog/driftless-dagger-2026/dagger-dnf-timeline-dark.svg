<svg xmlns="http://www.w3.org/2000/svg" width="680" height="284" viewBox="0 0 680 284" role="img" aria-labelledby="dnf-title dnf-desc" font-family="Noto Sans, sans-serif">
  <title id="dnf-title">Where riders dropped out of the Driftless Dagger</title>
  <desc id="dnf-desc">Course timeline from start to finish. Seven of the ten riders who did not finish dropped in the first 175 miles, three more dropped between miles 360 and 435, and eleven riders finished, with the author in 4th.</desc>
  <style>
    .t { fill: #f2f2f2; }
    .s { fill: #b8b8b8; }
    .ln { stroke: #5f5f5f; }
  </style>
  <defs>
    <path id="xm" d="M-4 -4L4 4M-4 4L4 -4" stroke="#a0a0a0" stroke-width="2" fill="none" stroke-linecap="round" />
  </defs>
  <rect x="0.5" y="0.5" width="679" height="283" rx="12" fill="#202020" stroke="#303030" />
  <text x="20" y="30" font-size="15" font-weight="500" class="t">21 started, 11 finished: where the other 10 dropped</text>
  <rect x="30" y="96" width="188" height="88" rx="4" fill="#383838" />
  <text x="124" y="112" text-anchor="middle" font-size="13" class="t">7 of 10 DNFs came</text>
  <text x="124" y="128" text-anchor="middle" font-size="13" class="t">in the first 175 miles</text>
  <line x1="30" y1="184" x2="620" y2="184" class="ln" stroke-width="1.5" />
  <line x1="109.8" y1="180" x2="109.8" y2="188" class="ln" />
  <line x1="175.4" y1="180" x2="175.4" y2="188" class="ln" />
  <line x1="226.3" y1="180" x2="226.3" y2="188" class="ln" />
  <line x1="277.5" y1="180" x2="277.5" y2="188" class="ln" />
  <line x1="363.5" y1="180" x2="363.5" y2="188" class="ln" />
  <line x1="442.4" y1="180" x2="442.4" y2="188" class="ln" />
  <line x1="521.2" y1="180" x2="521.2" y2="188" class="ln" />
  <line x1="567.1" y1="180" x2="567.1" y2="188" class="ln" />
  <line x1="620" y1="178" x2="620" y2="190" stroke="#b8b8b8" stroke-width="2" />
  <text x="30" y="206" font-size="13" class="s">Start</text>
  <text x="109.8" y="206" text-anchor="middle" font-size="13" class="s">Bellevue 74</text>
  <text x="175.4" y="224" text-anchor="middle" font-size="13" class="s">Dubuque 135</text>
  <text x="226.3" y="206" text-anchor="middle" font-size="13" class="s">Guttenberg 183</text>
  <text x="277.5" y="224" text-anchor="middle" font-size="13" class="s">Big Paint 230</text>
  <text x="363.5" y="206" text-anchor="middle" font-size="13" class="s">La Crescent 310</text>
  <text x="442.4" y="224" text-anchor="middle" font-size="13" class="s">Seneca 384</text>
  <text x="521.2" y="206" text-anchor="middle" font-size="13" class="s">Lancaster 457</text>
  <text x="567.1" y="224" text-anchor="middle" font-size="13" class="s">Dickeyville 500</text>
  <text x="620" y="206" text-anchor="middle" font-size="13" class="s">Finish 549</text>
  <circle cx="40" cy="162" r="5.5" fill="none" stroke="#858585" stroke-width="1.5" stroke-dasharray="2 3" />
  <use href="#xm" x="74.1" y="162" />
  <use href="#xm" x="108.5" y="162" />
  <use href="#xm" x="170" y="162" />
  <use href="#xm" x="172.3" y="144" />
  <use href="#xm" x="186.7" y="162" />
  <use href="#xm" x="210.9" y="162" />
  <use href="#xm" x="215.7" y="144" />
  <use href="#xm" x="418.9" y="162" />
  <use href="#xm" x="479.3" y="162" />
  <circle cx="496.5" cy="162" r="8" fill="none" stroke="#858585" stroke-width="1.5" stroke-dasharray="2 3" />
  <use href="#xm" x="496.5" y="162" opacity="0.6" />
  <text x="660" y="48" text-anchor="end" font-size="13" class="t">11 finished</text>
  <circle cx="632" cy="174" r="4.5" fill="#2a78d6" />
  <circle cx="632" cy="163" r="4.5" fill="#2a78d6" />
  <circle cx="632" cy="152" r="4.5" fill="#2a78d6" />
  <circle cx="632" cy="141" r="6" fill="#5DCAA5" />
  <circle cx="632" cy="130" r="4.5" fill="#2a78d6" />
  <circle cx="632" cy="119" r="4.5" fill="#2a78d6" />
  <circle cx="632" cy="108" r="4.5" fill="#2a78d6" />
  <circle cx="632" cy="97" r="4.5" fill="#2a78d6" />
  <circle cx="632" cy="86" r="4.5" fill="#2a78d6" />
  <circle cx="632" cy="75" r="4.5" fill="#2a78d6" />
  <circle cx="632" cy="64" r="4.5" fill="#2a78d6" />
  <text x="642" y="178" font-size="13" class="s">1st</text>
  <text x="642" y="145" font-size="13" font-weight="500" class="t">4th</text>
  <text x="642" y="68" font-size="13" class="s">11th</text>
  <g font-size="13" class="s">
    <use href="#xm" x="26" y="242" />
    <text x="40" y="247">Did not finish</text>
    <circle cx="172" cy="242" r="8" fill="none" stroke="#858585" stroke-width="1.5" stroke-dasharray="2 3" />
    <use href="#xm" x="172" y="242" opacity="0.6" />
    <text x="188" y="247">Left the course near mile 434 (approximate)</text>
    <circle cx="26" cy="264" r="5.5" fill="none" stroke="#858585" stroke-width="1.5" stroke-dasharray="2 3" />
    <text x="40" y="269">Registered, did not start</text>
    <circle cx="236" cy="264" r="4.5" fill="#2a78d6" />
    <text x="248" y="269">Finisher</text>
    <circle cx="326" cy="264" r="6" fill="#5DCAA5" />
    <text x="338" y="269">Me, 4th</text>
  </g>
</svg>